function emptyMatch(){const noCity=RESPONSE.outcome==='no_category_in_city',isDecor=ANALYSIS.demo===3;return `<div class="empty-state reveal"><div class="empty-icon">${icon(noCity?'music':'calendar')}</div><div><span class="pill pill-gold" style="margin-bottom:16px">${t('demoLabel')}</span><h3>${t(noCity?'noCityTitle':isDecor?'filteredTitle':'filteredGenericTitle')}</h3><p>${esc(summaryFor(ANALYSIS,RESPONSE.outcome))}</p><div class="empty-actions">${noCity?`<button class="btn btn-primary" data-action="try-almaty">${icon('pin')}${t('tryAlmaty')}</button>`:`<button class="btn btn-primary" data-action="change-date">${icon('calendar')}${t('changeDate')}</button>`}<a class="btn btn-secondary" href="index.html">${t('viewAll')}</a></div>${!noCity?exclusions():''}</div></div>`;}
function renderResults(){if(!RESPONSE)return;const target=$('#results');if(!target)return;target.setAttribute('aria-busy','false');const html=RESPONSE.outcome==='found'?`<div class="results-header"><div><div class="result-status"><span class="pill pill-teal">${icon('check')}${t('resultVerified')}</span></div><h2>${t('resultTitle')}</h2><p>${esc(summaryFor(ANALYSIS,RESPONSE.outcome))}</p>${lang!=='ru'?`<p class="tiny">${t('explanationsRU')}</p>`:''}</div><span class="pill">${t('demoLabel')}</span></div>${criteriaPanel()}<div class="match-grid">${RESPONSE.cards.map(matchCard).join('')}</div><div class="result-foot"><details class="exclusion-details"><summary>${icon('info')}${t('whyNot')}${icon('down','class="chevron"')}</summary>${exclusions()}</details><button class="btn btn-secondary" data-action="compare" aria-expanded="${compareOpen}" aria-controls="compare-container">${icon('calendar')}${t(compareOpen?'hideCompare':'compare')}</button></div><div id="compare-container">${compareOpen?compareBox():''}</div>`:emptyMatch();showMatchState(html,RESPONSE.outcome==='found'?'found':'sorry',RESPONSE.outcome==='found'?t(ANALYSIS.criteriaKeys[0]):summaryFor(ANALYSIS,RESPONSE.outcome));}
const PIPE_KEYS=['pipeCriteria','pipeFilter','pipeRanked','pipeCard','pipeCritic','pipeDone'];
const EVENT_TYPES=['criteria','filter_step','ranked','card','critic','done'];
function pipelineHTML(active){return `<div class="pipeline-panel"><h3>${t('pipelineTitle')}</h3><div class="pipeline-steps">${PIPE_KEYS.map((k,i)=>`<div class="pipeline-node ${i<active?'done':i===active?'active':''}">${icon(i<active?'check':i===active?'spark':'clock')}<span>${t(k)}</span></div>`).join('')}</div><p class="pipeline-status" role="status" aria-live="polite">${t(PIPE_KEYS[active])}</p><p class="tiny muted" style="margin-top:7px">${t('pipelineNote')}</p></div>`;}
function readRequest(){const f=$('#request-form'),v=new FormData(f),r={category:v.get('category')||REQUEST.category,city:v.get('city'),date:v.get('date'),eventType:v.get('eventType'),budgetKzt:Number(v.get('budgetKzt'))};if(v.get('language'))r.language=v.get('language');if(v.get('durationHours'))r.durationHours=Number(v.get('durationHours'));return r;}
function validISODate(s){return typeof s==='string'&&/^2026-\d{2}-\d{2}$/.test(s)&&s>='2026-09-23'&&s<='2026-12-31'&&!Number.isNaN(Date.parse(s))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;}
function requestValid(r){const key=!validISODate(r.date)?'dateError':!Number.isFinite(r.budgetKzt)||r.budgetKzt<=0?'budgetError':r.durationHours&&(!Number.isFinite(r.durationHours)||r.durationHours<1||r.durationHours>24)?'durationError':null;const el=$('#request-error');if(el){el.hidden=!key;el.textContent=key?t(key):'';}return!key;}
function setAnalysis(){const result=analyse(REQUEST);ANALYSIS=result.meta;RESPONSE=result.response;}
async function runSearch(r=readRequest()){if(searchBusy)return;if(!requestValid(r))return;REQUEST={...r};setAnalysis();searchBusy=true;compareOpen=false;const token=++searchToken;const started=performance.now();const events=[];if(PAGE==='match'){$('#request-form').outerHTML=matchForm();$('#results').setAttribute('aria-busy','true');showMatchState(pipelineHTML(0),'thinking',t('pipelineTitle'));$('#results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}else{$('#manager-panel').innerHTML=managerSelection();$('#manager-dynamic').setAttribute('aria-busy','true');}$$('#request-form input, #request-form select, #request-form button').forEach(el=>el.disabled=true);for(let i=0;i<6;i++){if(token!==searchToken)return;if(PAGE==='match')showMatchState(pipelineHTML(i),'thinking',t('pipelineTitle'));else $$('.timeline-item').forEach((el,j)=>el.classList.toggle('done',j<=i));announce(t(PIPE_KEYS[i]));await new Promise(resolve=>setTimeout(resolve,250));}if(token!==searchToken)return;setAnalysis();for(const type of EVENT_TYPES){if(type==='criteria')events.push({type,data:{criteria:RESPONSE.criteria}});if(type==='filter_step')events.push(...RESPONSE.funnel.map(data=>({type,data})));if(type==='ranked')events.push({type,data:{ids:ANALYSIS.eligible.map(p=>p.id)}});if(type==='card')events.push(...RESPONSE.cards.map(data=>({type,data})));if(type==='critic')events.push({type,data:critic(RESPONSE,REQUEST)});if(type==='done')events.push({type,data:RESPONSE});}window.ToiMatch.lastEvents=events;window.ToiMatch.lastDurationMs=Math.round(performance.now()-started);searchBusy=false;if(PAGE==='match'){$('#request-form').outerHTML=matchForm();renderResults();$('#results').focus({preventScroll:true});}else{$('#manager-panel').innerHTML=managerSelection();$('#manager-dynamic').focus({preventScroll:true});}announce(summaryFor(ANALYSIS,RESPONSE.outcome));}
function critic(response,r){const problems=[];for(const c of response.cards){const p=byId(c.id);if(!p){problems.push({id:c.id,problem:'Нет профиля'});continue;}if(p.priceFromKzt!==c.priceFromKzt||p.priceFromKzt>r.budgetKzt)problems.push({id:c.id,problem:'Цена не совпадает'});if(p.busyDates.includes(r.date))problems.push({id:c.id,problem:'Дата занята'});if(!p.eventFormats.includes(r.eventType)||!p.categories.includes(r.category)||p.city!==r.city)problems.push({id:c.id,problem:'Не соответствует условиям'});if(r.language&&!p.languages.includes(r.language))problems.push({id:c.id,problem:'Язык не совпадает'});if(r.durationHours&&p.maxHours!==null&&p.maxHours<r.durationHours)problems.push({id:c.id,problem:'Недостаточно часов'});const expected=recordFacts(p,r,c.factsUsed.find(f=>!f.verified)?.label);for(const f of c.factsUsed){if(!expected.some(e=>e.key===f.key&&e.label===f.label&&e.verified===f.verified))problems.push({id:c.id,problem:'Утверждение не совпадает с каталогом'});}}return{ok:!problems.length,problems};}
function managerTitle(title,subtitle){return `<div class="manager-title"><div><h1>${t(title)}</h1><p>${t(subtitle)}</p></div><span class="pill pill-teal"><span class="dot"></span>${t('demo')}</span></div>`;}

function calendarFeedback(p){if(!PROFILE.selected)return `<div><p>${t('chooseDay')}</p><p>${t('calendarNote')}</p></div>`;const busy=p.busyDates.includes(PROFILE.selected);return `<div><p><strong>${t(busy?'dayBusy':'dayAvailable',{date:dateText(PROFILE.selected,true)})}</strong></p><p>${t('calendarNote')}</p></div><a class="btn btn-secondary" href="${esc(matchURL(p))}">${t(busy?'findAlternative':'findForDay')}</a>`;}
function renderProfile(){const p=byId(PROFILE.id);if(!p){document.title=t('profileNotFound')+' — ToiMatch';$('#main').innerHTML=`<div class="container not-found"><div class="empty-state"><div class="empty-icon">${icon('search')}</div><div><h1 style="font-size:35px">${t('profileNotFound')}</h1><p>${t('profileNotFoundBody')}</p><a class="btn btn-primary" href="index.html">${t('backCatalog')}</a></div></div></div>`;return;}document.title=displayName(p)+' — ToiMatch';$('#main').innerHTML=`<div class="container"><nav class="breadcrumb" aria-label="${t('backCatalog')}"><a class="text-link" href="index.html">${t('catalog')}</a>${icon('chevron')}<span>${esc(displayName(p))}</span></nav><section class="profile-layout">${photo(p,'profile-photo',true)}<div class="profile-copy"><div class="profile-topline">${p.categories.map(c=>`<span class="pill pill-teal">${icon(categoryIcon(c))}${tr(c,'category')}</span>`).join('')}</div><h1>${esc(displayName(p))}</h1><div class="profile-location">${icon('pin')}${tr(p.city,'city')}<span aria-hidden="true">/</span><span>${p.id}</span></div>${p.id==='HK-64395'?`<p class="tiny muted" style="margin-top:9px">${esc(t('anonymisedName',{name:p.anonName}))}</p>`:''}<p class="profile-price"><span>${t('from')}</span>${money(p.priceFromKzt)}</p><p class="profile-price-note">${t('profilePriceNote')}</p><div class="profile-facts"><div class="profile-fact"><span>${icon('calendar')}${t('formats')}</span><b>${p.eventFormats.map(v=>tr(v,'format')).join(', ')}</b></div><div class="profile-fact"><span>${icon('globe')}${t('languages')}</span><b>${p.languages.map(v=>tr(v,'language')).join(', ')}</b></div><div class="profile-fact"><span>${icon('clock')}${t('hours')}</span><b>${p.maxHours===null?t('noHourLimit'):t('upToHours',{n:p.maxHours})}</b></div></div>${flags(p)}<a class="btn btn-primary profile-cta" href="${esc(matchURL(p))}">${icon('spark')}${t('profileCTA')}</a></div></section><section class="profile-info"><div class="description-block"><h2>${t('profileAbout')}</h2><p class="description-label">${icon('info')}${t('selfReported')}</p><p class="description-text ${PROFILE.expanded?'':'clamped'}" id="profile-description" lang="ru">${esc(p.description)}</p>${p.description.length>400?`<button class="btn btn-quiet description-toggle" data-action="description" aria-expanded="${PROFILE.expanded}" aria-controls="profile-description">${t(PROFILE.expanded?'readLess':'readMore')}${icon('down')}</button>`:''}</div><aside class="data-note"><h3>${t('sourceNoteTitle')}</h3><p>${t('sourceNoteBody')}</p></aside></section><section class="calendar-section" aria-labelledby="calendar-heading"><div class="section-head"><div><h2 id="calendar-heading">${t('calendarTitle')}</h2><p>${t('calendarSubtitle')}</p></div><div class="calendar-legend"><span><i></i>${t('available')}</span><span><i class="busy"></i>${t('busy')}</span><span><i class="outside"></i>${t('outside')}</span></div></div><div class="calendar-grid">${[8,9,10,11].map(m=>calendarMonth(p,m)).join('')}</div><div id="calendar-feedback" class="calendar-feedback ${p.busyDates.includes(PROFILE.selected)?'busy':''}" aria-live="polite">${calendarFeedback(p)}</div></section></div>`;}
function renderPage(){header();if(PAGE==='index')renderCatalogue();if(PAGE==='match')renderMatch();if(PAGE==='admin')renderManager();if(PAGE==='contractor')renderProfile();}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.lang){const wasBusy=searchBusy;if(searchBusy){searchToken++;searchBusy=false;setAnalysis();}if(!wasBusy&&$('#request-form'))REQUEST=readRequest();lang=button.dataset.lang;storage.set('toimatch-language',lang);const oldScroll=scrollY;renderPage();scrollTo(0,oldScroll);$(`[data-lang="${lang}"]`).focus({preventScroll:true});return;}if(button.classList.contains('mobile-menu')){const open=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',open);$('#primary-nav').classList.toggle('open',open);return;}
if('category'in button.dataset){if(button.dataset.mode==='catalog'){CATALOG.category=button.dataset.category;CATALOG.limit=12;$('#catalog-filters [name=category]').value=CATALOG.category;$$('#catalog-categories [data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===CATALOG.category));updateCatalogue();}else{REQUEST=readRequest();REQUEST.category=button.dataset.category;$('#request-form [name=category]').value=REQUEST.category;$$('#match-categories [data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===REQUEST.category));}return;}
if('scenario'in button.dataset){if(searchBusy)return;REQUEST={...SCENARIOS[Number(button.dataset.scenario)]};if(PAGE==='match')$('#request-form').outerHTML=matchForm();else $('#manager-panel').innerHTML=managerSelection();runSearch({...REQUEST});return;}
if(button.dataset.tab){const wasBusy=searchBusy;if(searchBusy){searchToken++;searchBusy=false;setAnalysis();}if(!wasBusy&&$('#request-form'))REQUEST=readRequest();activeManagerTab=button.dataset.tab;history.replaceState(null,'','#'+activeManagerTab);$$('.manager-tab').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===activeManagerTab);b.tabIndex=b.dataset.tab===activeManagerTab?0:-1;});renderManagerPanel();return;}
if(button.dataset.day){PROFILE.selected=button.dataset.day;const p=byId(PROFILE.id);$$('.day').forEach(b=>{b.classList.toggle('selected',b.dataset.day===PROFILE.selected);b.setAttribute('aria-pressed',b.dataset.day===PROFILE.selected?'true':'false');});$('#calendar-feedback').classList.toggle('busy',p.busyDates.includes(PROFILE.selected));$('#calendar-feedback').innerHTML=calendarFeedback(p);$('.profile-cta').href=matchURL(p);return;}
switch(button.dataset.action){case'reset-catalog':Object.assign(CATALOG,{category:'',city:'',format:'',language:'',min:'',max:'',sort:'recommended',limit:12});{const y=scrollY;renderCatalogue();scrollTo(0,y);$('#catalog-filters select').focus({preventScroll:true});}break;case'more-catalog':{const n=Math.min(CATALOG.limit,filteredCatalogue().length);CATALOG.limit+=12;updateCatalogue();const a=$$('.catalog-card .card-photo-link')[n];if(a)a.focus({preventScroll:true});}break;case'compare':compareOpen=!compareOpen;button.setAttribute('aria-expanded',String(compareOpen));button.innerHTML=icon('calendar')+t(compareOpen?'hideCompare':'compare');$('#compare-container').innerHTML=compareOpen?compareBox():'';break;case'apply-compare':REQUEST={...SCENARIOS[0],date:'2026-10-23'};runSearch({...REQUEST});break;case'try-almaty':REQUEST={...REQUEST,city:'Алматы'};runSearch({...REQUEST});break;case'change-date':{const input=$('#request-form [name=date]');input.scrollIntoView({block:'center',behavior:'smooth'});input.focus({preventScroll:true});try{input.showPicker()}catch{}}break;case'description':PROFILE.expanded=!PROFILE.expanded;$('#profile-description').classList.toggle('clamped',!PROFILE.expanded);button.setAttribute('aria-expanded',String(PROFILE.expanded));button.innerHTML=t(PROFILE.expanded?'readLess':'readMore')+icon('down');break;case'reset-manager-catalog':Object.assign(M_FILTER,{query:'',city:'',category:''});renderManagerPanel();$('#manager-query').focus();break;}
});
document.addEventListener('submit',e=>{if(e.target.id==='request-form'){e.preventDefault();runSearch();}if(e.target.id==='catalog-filters')e.preventDefault();});
document.addEventListener('input',e=>{if(e.target.closest('#catalog-filters')&&e.target.tagName==='INPUT'){CATALOG[e.target.name]=e.target.value;CATALOG.limit=12;updateCatalogue();}if(e.target.id==='manager-query'){M_FILTER.query=e.target.value;updateManagerCatalogue();}});
document.addEventListener('change',e=>{if(e.target.closest('#catalog-filters')){CATALOG[e.target.name]=e.target.value;CATALOG.limit=12;$$('#catalog-categories [data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===CATALOG.category));updateCatalogue();}if(e.target.id==='catalog-sort'){CATALOG.sort=e.target.value;updateCatalogue();}if(e.target.closest('#request-form')&&e.target.name==='category'){REQUEST.category=e.target.value;$$('#match-categories [data-category]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===REQUEST.category));}if(e.target.id==='manager-city'){M_FILTER.city=e.target.value;updateManagerCatalogue();}if(e.target.id==='manager-category'){M_FILTER.category=e.target.value;updateManagerCatalogue();}});
document.addEventListener('keydown',e=>{if(e.target.matches('.manager-tab')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();const tabs=$$('.manager-tab'),i=tabs.indexOf(e.target);const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(['ArrowLeft','ArrowUp'].includes(e.key)?-1:1)+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click();}});
window.addEventListener('hashchange',()=>{if(PAGE==='admin'&&['selection','catalog','quality'].includes(location.hash.slice(1))){activeManagerTab=location.hash.slice(1);renderManager();}});
async function init(){let raw=JSON.parse($('#catalog-data').textContent);if(location.protocol!=='file:'){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),1800);try{const res=await fetch('contractors.json',{signal:controller.signal});if(res.ok){const fresh=await res.json();if(Array.isArray(fresh)&&fresh.length&&fresh.every(p=>p.id&&Array.isArray(p.categories)&&Array.isArray(p.busy_dates)))raw=fresh;}}finally{clearTimeout(timer);}}catch{/* The embedded snapshot keeps the reference usable offline. */}}DATA=raw.map(detail);const params=new URLSearchParams(location.search);if(PAGE==='match'){for(const[key,valid]of Object.entries({city:CITY_VALUES,category:CATEGORY_VALUES,eventType:FORMAT_VALUES})){if(valid.includes(params.get(key)))REQUEST[key]=params.get(key);}const date=params.get('date');if(validISODate(date))REQUEST.date=date;if(Number.isFinite(Number(params.get('budgetKzt')))&&Number(params.get('budgetKzt'))>0)REQUEST.budgetKzt=Number(params.get('budgetKzt'));}if(PAGE==='admin'&&['selection','catalog','quality'].includes(location.hash.slice(1)))activeManagerTab=location.hash.slice(1);setAnalysis();window.ToiMatch={getData:()=>DATA.map(p=>structuredClone(p)),getResponse:()=>structuredClone(RESPONSE),getRequest:()=>({...REQUEST}),match:r=>analyse(r).response,critic,scenarios:SCENARIOS.map(s=>({...s})),list:query=>{const q=query??{},items=DATA.filter(p=>(!q.city||p.city===q.city)&&(!q.category||p.categories.includes(q.category))&&(!q.eventFormat||p.eventFormats.includes(q.eventFormat))&&(!q.language||p.languages.includes(q.language))&&(q.priceMin==null||p.priceFromKzt>=q.priceMin)&&(q.priceMax==null||p.priceFromKzt<=q.priceMax));return{items:items.slice(q.offset??0,(q.offset??0)+(q.limit??66)).map(({description,busyDates,...p})=>structuredClone(p)),total:items.length,limit:q.limit??66,offset:q.offset??0}},detail:id=>{const p=byId(id);return p?structuredClone(p):null},busyCount,lastEvents:[],lastDurationMs:0};renderPage();document.body.dataset.ready='true';}
init().catch(error=>{console.error(error);$('#main').innerHTML='<div class="container not-found"><h1>Не удалось загрузить каталог</h1><p>Обновите страницу. В HTML встроена резервная копия данных.</p></div>';});
})();
